<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisitorPass — Reception Security & Visitor Management</title>
  <meta http-equiv="refresh" content="0; url=dashboard.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .welcome-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      padding: 24px;
    }
    .welcome-card {
      background: var(--bg-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-xl);
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .welcome-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
      border-radius: 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    .welcome-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .welcome-subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.5;
    }
    .welcome-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <div class="welcome-card">
      <div class="welcome-logo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="welcome-title">Visitor<span style="color: var(--primary);">Pass</span></h1>
      <p class="welcome-subtitle">
        Enterprise Visitor Management System.<br>
        Digitizing check-in, tracking premise occupancy, and issuing verified passes.
      </p>

      <div class="welcome-actions">
        <a href="dashboard.html" class="btn btn-primary btn-lg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Enter Front-Desk Dashboard
        </a>
        <a href="register.html" class="btn btn-secondary btn-lg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          Quick Register Visitor
        </a>
      </div>

      <div style="margin-top: 24px; font-size: 0.78rem; color: var(--text-light);">
        FastAPI REST Backend &bull; SQLite Database &bull; Secured Check-in
      </div>
    </div>
  </div>

  <script>
    // Seamless automatic redirect to Dashboard
    window.location.href = "dashboard.html";
  </script>
</body>
</html>
