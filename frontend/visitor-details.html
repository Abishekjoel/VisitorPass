<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Profile Details — VisitorPass</title>
  <meta name="description" content="Comprehensive visitor profile, security audit trail, check-in timestamps, and actions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .details-grid-wrap {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }
    .profile-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .profile-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border: 3px solid var(--primary-border);
    }
    .profile-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .profile-org {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .profile-actions-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }
    .info-section {
      margin-bottom: 24px;
    }
    .info-section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }
    .meta-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .meta-label {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .meta-val {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .notes-box {
      background: var(--bg-surface-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 0.88rem;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      margin-top: 6px;
    }
    @media (max-width: 900px) {
      .details-grid-wrap {
        grid-template-columns: 1fr;
      }
      .meta-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="brand-title">Visitor<span>Pass</span> <span class="brand-tag">PRO</span></div>
      </div>

      <nav class="nav-menu">
        <div class="nav-heading">Main Menu</div>
        <a href="dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a href="register.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          Register Visitor
        </a>
        <a href="visitors.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Visitor Records
        </a>
        <a href="currently-inside.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
          Currently Inside
          <span class="nav-badge" id="nav-inside-count">0</span>
        </a>

        <div class="nav-heading" style="margin-top: 10px;">Management</div>
        <a href="reports.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          Reports & Export
        </a>
        <a href="settings.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <a href="visitors.html" class="btn btn-secondary btn-sm" style="margin-right: 8px;">
            &larr; Back to Records
          </a>
          <div class="header-title-wrap">
            <h1 id="header-visitor-title">Visitor Profile</h1>
            <p id="header-visitor-subtitle">Loading visitor credentials...</p>
          </div>
        </div>

        <div class="header-right">
          <button class="btn btn-secondary btn-sm" id="btn-print-pass-top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Print Visitor Pass
          </button>
        </div>
      </header>

      <div class="page-body">
        <div id="visitor-details-content" class="details-grid-wrap">
          <div class="empty-state" style="grid-column: span 2;">
            <div class="spinner spinner-dark"></div>
            <div style="margin-top: 10px; color: var(--text-muted);">Fetching visitor dossier...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Visitor Modal -->
  <div class="modal-overlay" id="edit-details-modal">
    <div class="modal-window">
      <div class="modal-header">
        <h3>Edit Visitor Record</h3>
        <button class="modal-close" onclick="App.closeModal('edit-details-modal')">&times;</button>
      </div>
      <form id="edit-details-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="ed-name">Full Name</label>
              <input type="text" id="ed-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ed-phone">Phone</label>
              <input type="tel" id="ed-phone" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ed-email">Email</label>
              <input type="email" id="ed-email" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ed-org">Organization</label>
              <input type="text" id="ed-org" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ed-person">Person to Visit</label>
              <input type="text" id="ed-person" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ed-purpose">Purpose of Visit</label>
              <input type="text" id="ed-purpose" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ed-vehicle">Vehicle Number</label>
              <input type="text" id="ed-vehicle" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="ed-id-num">ID Number</label>
              <input type="text" id="ed-id-num" class="form-control">
            </div>
            <div class="form-group col-full">
              <label class="form-label" for="ed-notes">Remarks / Notes</label>
              <textarea id="ed-notes" rows="2" class="form-control"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="App.closeModal('edit-details-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let currentVisitor = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const visitorId = urlParams.get("id");

      if (!visitorId) {
        document.getElementById("visitor-details-content").innerHTML = `
          <div class="empty-state" style="grid-column: span 2;">
            <div class="empty-title" style="color: var(--danger);">No Visitor ID Provided</div>
            <div class="empty-text">Please select a visitor from the records list.</div>
            <a href="visitors.html" class="btn btn-primary btn-sm">Return to Visitor Records</a>
          </div>
        `;
        return;
      }

      loadVisitorProfile(visitorId);

      document.getElementById("btn-print-pass-top").addEventListener("click", () => {
        if (currentVisitor) App.showPassModal(currentVisitor);
      });

      document.getElementById("edit-details-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!currentVisitor) return;

        const payload = {
          full_name: document.getElementById("ed-name").value.trim(),
          phone: document.getElementById("ed-phone").value.trim(),
          email: document.getElementById("ed-email").value.trim(),
          organization: document.getElementById("ed-org").value.trim(),
          person_to_visit: document.getElementById("ed-person").value.trim(),
          purpose: document.getElementById("ed-purpose").value.trim(),
          vehicle_number: document.getElementById("ed-vehicle").value.trim() || null,
          id_number: document.getElementById("ed-id-num").value.trim() || null,
          notes: document.getElementById("ed-notes").value.trim() || null
        };

        try {
          const updated = await App.fetchAPI(`/visitors/${currentVisitor.visitor_id}`, {
            method: "PUT",
            body: JSON.stringify(payload)
          });
          App.toastSuccess("Profile Updated", "Visitor details have been modified successfully.");
          App.closeModal("edit-details-modal");
          currentVisitor = updated;
          renderProfile(updated);
        } catch (err) {
          App.toastError("Update Failed", err.message);
        }
      });
    });

    async function loadVisitorProfile(visitorId) {
      try {
        const visitor = await App.fetchAPI(`/visitors/${visitorId}`);
        currentVisitor = visitor;
        renderProfile(visitor);
      } catch (err) {
        document.getElementById("visitor-details-content").innerHTML = `
          <div class="empty-state" style="grid-column: span 2;">
            <div class="empty-title" style="color: var(--danger);">Visitor Not Found</div>
            <div class="empty-text">${err.message || 'The requested visitor record does not exist or has been removed.'}</div>
            <a href="visitors.html" class="btn btn-primary btn-sm">Return to Records</a>
          </div>
        `;
        App.toastError("Profile Error", err.message);
      }
    }

    function renderProfile(v) {
      document.getElementById("header-visitor-title").textContent = v.full_name;
      document.getElementById("header-visitor-subtitle").textContent = `${v.visitor_id} • ${v.organization}`;

      const isInside = v.status === "Checked In";
      const statusBadge = isInside
        ? `<span class="badge badge-in"><span class="badge-dot"></span>Checked In (Inside)</span>`
        : `<span class="badge badge-out"><span class="badge-dot"></span>Checked Out</span>`;

      const container = document.getElementById("visitor-details-content");
      container.innerHTML = `
        <!-- Left Column: Profile Card & Actions -->
        <div>
          <div class="profile-card">
            <div class="profile-avatar-large">${App.getInitials(v.full_name)}</div>
            <div class="profile-name">${v.full_name}</div>
            <div class="profile-org">${v.organization}</div>
            <div class="visitor-id-tag" style="margin-top: 10px; font-size: 0.95rem;">${v.visitor_id}</div>
            <div style="margin-top: 14px;">${statusBadge}</div>

            <div class="profile-actions-stack">
              <button class="btn btn-secondary" onclick="App.showPassModal(currentVisitor)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/></svg>
                View / Print Pass
              </button>

              ${isInside ? `
                <button class="btn btn-primary" onclick="handleProfileCheckout()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                  Check Out Visitor
                </button>
              ` : `
                <div style="padding: 10px; background: var(--bg-surface-subtle); border-radius: var(--radius-md); font-size: 0.8rem; color: var(--text-muted);">
                  Checked Out: ${App.formatDateTime(v.check_out)}
                </div>
              `}

              <button class="btn btn-secondary" onclick="openDetailsEditModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                Edit Information
              </button>

              <button class="btn btn-danger btn-sm" onclick="handleProfileDelete()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Delete Record
              </button>
            </div>
          </div>
        </div>

        <!-- Right Column: Structured Information Tabs/Dossier -->
        <div class="content-card" style="margin-bottom: 0;">
          <div class="card-header">
            <div class="card-title-group">
              <h2>Visit Audit Dossier</h2>
              <p>Official record and timestamp verification</p>
            </div>
            <a href="visitors.html" class="btn btn-secondary btn-sm">&larr; Back to Records</a>
          </div>

          <div class="card-body">
            <!-- Visit Information -->
            <div class="info-section">
              <div class="info-section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Visit & Host Information
              </div>
              <div class="meta-list">
                <div class="meta-item">
                  <span class="meta-label">Person to Visit / Host</span>
                  <span class="meta-val">${v.person_to_visit}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Purpose of Visit</span>
                  <span class="meta-val">${v.purpose}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Organization / Company</span>
                  <span class="meta-val">${v.organization}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Vehicle Registration</span>
                  <span class="meta-val">${v.vehicle_number || 'None (Walk-in / Cab)'}</span>
                </div>
              </div>
            </div>

            <!-- Verification & Identity -->
            <div class="info-section">
              <div class="info-section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Identity Verification & Contact
              </div>
              <div class="meta-list">
                <div class="meta-item">
                  <span class="meta-label">Phone Number</span>
                  <span class="meta-val">${v.phone}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Email Address</span>
                  <span class="meta-val">${v.email}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">ID Type</span>
                  <span class="meta-val">${v.id_type}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">ID Document Number</span>
                  <span class="meta-val" style="font-family: monospace;">${v.id_number}</span>
                </div>
                <div class="meta-item" style="grid-column: span 2;">
                  <span class="meta-label">Contact / Residential Address</span>
                  <span class="meta-val">${v.address || 'Not specified'}</span>
                </div>
              </div>
            </div>

            <!-- Timestamps & Duration -->
            <div class="info-section">
              <div class="info-section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Timestamps & Duration
              </div>
              <div class="meta-list">
                <div class="meta-item">
                  <span class="meta-label">Check-In Timestamp</span>
                  <span class="meta-val">${App.formatDateTime(v.check_in)}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Check-Out Timestamp</span>
                  <span class="meta-val">${v.check_out ? App.formatDateTime(v.check_out) : 'Currently On Premises'}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Duration of Stay</span>
                  <span class="meta-val" style="color: var(--primary); font-size: 1.1rem;">${v.duration}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Visit Status</span>
                  <span class="meta-val">${statusBadge}</span>
                </div>
              </div>
            </div>

            <!-- Notes & Remarks -->
            <div class="info-section" style="margin-bottom: 0;">
              <div class="info-section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Security Notes & Remarks
              </div>
              <div class="notes-box">
                ${v.notes ? v.notes : '<em>No security remarks entered for this visitor.</em>'}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function handleProfileCheckout() {
      if (!currentVisitor) return;
      App.checkOutVisitor(currentVisitor.visitor_id, currentVisitor.full_name, (res) => {
        currentVisitor = res.visitor;
        renderProfile(res.visitor);
      });
    }

    function handleProfileDelete() {
      if (!currentVisitor) return;
      App.deleteVisitor(currentVisitor.visitor_id, currentVisitor.full_name, () => {
        window.location.href = "visitors.html";
      });
    }

    function openDetailsEditModal() {
      if (!currentVisitor) return;
      document.getElementById("ed-name").value = currentVisitor.full_name;
      document.getElementById("ed-phone").value = currentVisitor.phone;
      document.getElementById("ed-email").value = currentVisitor.email;
      document.getElementById("ed-org").value = currentVisitor.organization;
      document.getElementById("ed-person").value = currentVisitor.person_to_visit;
      document.getElementById("ed-purpose").value = currentVisitor.purpose;
      document.getElementById("ed-vehicle").value = currentVisitor.vehicle_number || "";
      document.getElementById("ed-id-num").value = currentVisitor.id_number || "";
      document.getElementById("ed-notes").value = currentVisitor.notes || "";

      App.openModal("edit-details-modal");
    }
  </script>
</body>
</html>
